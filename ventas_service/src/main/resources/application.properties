# Puerto del servidor
server.port=8082

# URL del microservicio de clientes
cliente.service.url=http://localhost:8081

# Configuración de la base de datos MySQL - CORREGIDA
spring.datasource.url=jdbc:mysql://localhost:3306/venta_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.venta.service=INFO